<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>InFox · IP Intelligence Suite</title>
    <style>
        /* ---------- RESET & BASE ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100vh;
        }

        body {
            background: #0a0e1a;
            color: #b8d0f0;
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            padding: 0.6rem;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
        }

        /* ---------- ANIMATED MATRIX GRID ---------- */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(0, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
            animation: gridPulse 8s ease-in-out infinite alternate;
        }

        @keyframes gridPulse {
            0% {
                opacity: 0.3;
            }
            100% {
                opacity: 0.8;
            }
        }

        /* ---------- AMBIENT GLOW ORBS ---------- */
        .glow-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
            opacity: 0.3;
            animation: orbFloat 20s ease-in-out infinite alternate;
        }

        .glow-orb--1 {
            width: 400px;
            height: 400px;
            background: rgba(0, 200, 255, 0.08);
            top: -100px;
            right: -100px;
            animation-duration: 25s;
        }

        .glow-orb--2 {
            width: 500px;
            height: 500px;
            background: rgba(160, 80, 255, 0.06);
            bottom: -150px;
            left: -150px;
            animation-duration: 30s;
            animation-delay: -5s;
        }

        @keyframes orbFloat {
            0% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(60px, -40px) scale(1.1);
            }
            66% {
                transform: translate(-30px, 50px) scale(0.9);
            }
            100% {
                transform: translate(40px, 20px) scale(1.05);
            }
        }

        /* ---------- APP CONTAINER ---------- */
        .app-wrapper {
            position: relative;
            z-index: 1;
            max-width: 820px;
            width: 100%;
            background: rgba(10, 14, 30, 0.82);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 2.8rem;
            padding: 1.8rem 1.6rem 1.4rem;
            border: 1px solid rgba(0, 255, 255, 0.10);
            box-shadow: 0 0 60px rgba(0, 255, 255, 0.04), 0 0 120px rgba(0, 200, 255, 0.02);
            transition: box-shadow 0.5s ease;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .app-wrapper:hover {
            box-shadow: 0 0 80px rgba(0, 255, 255, 0.07), 0 0 160px rgba(0, 200, 255, 0.03);
        }

        /* ---------- HEADER ---------- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.4rem 1rem;
            margin-bottom: 1.4rem;
            padding-bottom: 0.9rem;
            border-bottom: 1px solid rgba(0, 255, 255, 0.08);
            flex-shrink: 0;
        }

        .brand {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #00e5ff, #a78bfa, #00e5ff);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 40px rgba(0, 229, 255, 0.15);
            animation: shimmer 6s ease-in-out infinite alternate;
        }

        @keyframes shimmer {
            0% {
                background-position: 0% 50%;
            }
            100% {
                background-position: 100% 50%;
            }
        }

        /* ---------- TOOLBAR / TABS ---------- */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin-bottom: 1rem;
            flex-shrink: 0;
        }

        .tab-btn {
            padding: 0.5rem 1.1rem;
            border-radius: 60px;
            border: 1px solid rgba(0, 255, 255, 0.08);
            background: rgba(0, 255, 255, 0.02);
            color: #7a93b5;
            font-size: 0.72rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.25s ease;
            letter-spacing: 0.3px;
            flex: 0 1 auto;
            font-family: inherit;
            touch-action: manipulation;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .tab-btn:hover {
            background: rgba(0, 255, 255, 0.06);
            border-color: rgba(0, 255, 255, 0.18);
            color: #b0d0f0;
        }

        .tab-btn:active {
            transform: scale(0.96);
        }

        .tab-btn.active {
            background: rgba(0, 229, 255, 0.08);
            border-color: rgba(0, 229, 255, 0.25);
            color: #00e5ff;
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.04);
        }

        /* ---------- INPUT ROW ---------- */
        .input-row {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            margin-bottom: 1rem;
            flex-shrink: 0;
        }

        .input-group {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .input-group input {
            flex: 1 1 180px;
            padding: 0.75rem 1.2rem;
            border-radius: 60px;
            border: 1px solid rgba(0, 255, 255, 0.12);
            background: rgba(0, 20, 50, 0.5);
            color: #d6e8ff;
            font-size: 0.9rem;
            outline: none;
            transition: 0.3s ease;
            min-width: 120px;
            font-family: inherit;
            -webkit-appearance: none;
            appearance: none;
        }

        .input-group input:focus {
            border-color: #00e5ff;
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.06), inset 0 0 20px rgba(0, 229, 255, 0.02);
            background: rgba(0, 30, 70, 0.5);
        }

        .input-group input::placeholder {
            color: #4a6080;
            font-weight: 300;
        }

        .action-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
        }

        /* ---------- NEON BUTTONS ---------- */
        .btn {
            padding: 0.65rem 1.2rem;
            border-radius: 60px;
            border: none;
            font-weight: 500;
            font-size: 0.78rem;
            letter-spacing: 0.3px;
            cursor: pointer;
            transition: 0.25s ease;
            background: rgba(0, 255, 255, 0.04);
            color: #8ab0d8;
            border: 1px solid rgba(0, 255, 255, 0.08);
            white-space: nowrap;
            font-family: inherit;
            touch-action: manipulation;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .btn:hover {
            background: rgba(0, 255, 255, 0.10);
            border-color: rgba(0, 255, 255, 0.25);
            transform: translateY(-1px);
            box-shadow: 0 4px 30px rgba(0, 255, 255, 0.04);
        }

        .btn:active {
            transform: scale(0.96) translateY(0);
        }

        .btn-primary {
            background: rgba(0, 229, 255, 0.08);
            border-color: rgba(0, 229, 255, 0.15);
            color: #00e5ff;
        }

        .btn-primary:hover {
            background: rgba(0, 229, 255, 0.16);
            border-color: rgba(0, 229, 255, 0.30);
            box-shadow: 0 0 40px rgba(0, 229, 255, 0.06);
        }

        .btn:disabled {
            opacity: 0.3;
            pointer-events: none;
            transform: none !important;
        }

        /* ---------- STATUS ---------- */
        .status {
            font-size: 0.72rem;
            color: #5a7a9a;
            min-height: 1.6rem;
            padding: 0.1rem 0.2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .status .spinner {
            display: inline-block;
            width: 0.9rem;
            height: 0.9rem;
            border: 2px solid rgba(0, 229, 255, 0.10);
            border-top-color: #00e5ff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            flex-shrink: 0;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .status .badge {
            padding: 0.05rem 0.7rem;
            border-radius: 40px;
            font-size: 0.55rem;
            background: rgba(0, 229, 255, 0.06);
            border: 1px solid rgba(0, 229, 255, 0.06);
            color: #5a8aaa;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            flex-shrink: 0;
        }

        .status .badge.error {
            background: rgba(255, 70, 70, 0.06);
            border-color: rgba(255, 70, 70, 0.10);
            color: #ff7a7a;
        }

        /* ---------- RESULTS ---------- */
        .results {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            margin-top: 0.1rem;
            flex: 1 1 auto;
            min-height: 0;
        }

        .card {
            background: rgba(0, 16, 40, 0.45);
            border-radius: 1.4rem;
            padding: 1rem 1.2rem;
            border: 1px solid rgba(0, 255, 255, 0.04);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.20);
            transition: 0.25s ease;
            animation: cardIn 0.4s ease-out;
        }

        @keyframes cardIn {
            0% {
                opacity: 0;
                transform: translateY(12px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card:hover {
            border-color: rgba(0, 255, 255, 0.08);
        }

        .card-title {
            font-size: 0.55rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #4a6a8a;
            margin-bottom: 0.5rem;
            padding-bottom: 0.25rem;
            border-bottom: 1px solid rgba(0, 255, 255, 0.03);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .card-title .dot {
            display: inline-block;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #00e5ff;
            box-shadow: 0 0 12px rgba(0, 229, 255, 0.2);
            animation: dotPulse 2s ease-in-out infinite;
            flex-shrink: 0;
        }

        @keyframes dotPulse {
            0%,
            100% {
                opacity: 0.3;
            }
            50% {
                opacity: 1;
            }
        }

        .card-content {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
            font-size: 0.82rem;
            line-height: 1.6;
            word-break: break-word;
        }

        .card-content .row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.2rem 0.6rem;
            padding: 0.05rem 0;
        }

        .card-content .label {
            color: #5a7a9a;
            font-weight: 400;
            min-width: 80px;
            font-size: 0.72rem;
            letter-spacing: 0.2px;
            flex-shrink: 0;
        }

        .card-content .value {
            color: #c8defa;
            font-weight: 400;
            word-break: break-all;
        }

        .card-content .value.highlight {
            color: #00e5ff;
            font-weight: 500;
            text-shadow: 0 0 20px rgba(0, 229, 255, 0.06);
        }

        .card-content .value.error-text {
            color: #ff7a7a;
        }

        .card-content .tag {
            display: inline-block;
            background: rgba(0, 229, 255, 0.04);
            padding: 0.02rem 0.7rem;
            border-radius: 40px;
            border: 1px solid rgba(0, 229, 255, 0.04);
            font-size: 0.65rem;
            color: #7aaac8;
        }

        .card-content .tag.purple {
            background: rgba(167, 139, 250, 0.04);
            border-color: rgba(167, 139, 250, 0.06);
            color: #a78bfa;
        }

        /* ---------- PORT GRID ---------- */
        .port-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(56px, 1fr));
            gap: 0.4rem;
            margin-top: 0.3rem;
        }

        .port-item {
            background: rgba(0, 16, 40, 0.4);
            border-radius: 20px;
            padding: 0.35rem 0.15rem;
            text-align: center;
            font-size: 0.6rem;
            border: 1px solid rgba(0, 255, 255, 0.03);
            transition: 0.15s ease;
        }

        .port-item.open {
            border-color: rgba(0, 255, 200, 0.20);
            background: rgba(0, 255, 200, 0.04);
        }

        .port-item.open .port-num {
            color: #7effd0;
        }

        .port-item.closed {
            border-color: rgba(255, 70, 70, 0.04);
            opacity: 0.5;
        }

        .port-item.unknown {
            border-color: rgba(255, 200, 0, 0.04);
            opacity: 0.4;
        }

        .port-item .port-num {
            font-weight: 600;
            font-size: 0.75rem;
            display: block;
            color: #8ab0d8;
        }

        .port-item .port-service {
            font-size: 0.45rem;
            opacity: 0.5;
            display: block;
            margin-top: 0.02rem;
        }

        .port-item .port-status {
            font-size: 0.4rem;
            display: block;
            opacity: 0.4;
            margin-top: 0.02rem;
        }

        /* ---------- DNS RECORD LIST ---------- */
        .dns-records {
            display: flex;
            flex-direction: column;
            gap: 0.15rem;
        }

        .dns-records .record {
            display: flex;
            flex-wrap: wrap;
            gap: 0.15rem 0.6rem;
            padding: 0.15rem 0;
            border-bottom: 1px solid rgba(0, 255, 255, 0.02);
            font-size: 0.75rem;
        }

        .dns-records .record .rtype {
            color: #5a8aaa;
            font-size: 0.6rem;
            font-weight: 500;
            min-width: 44px;
        }

        .dns-records .record .rdata {
            color: #b8d0f0;
            word-break: break-all;
        }

        /* ---------- FOOTER CREDIT ---------- */
        .footer-credit {
            margin-top: 1.2rem;
            padding-top: 0.7rem;
            border-top: 1px solid rgba(0, 255, 255, 0.05);
            text-align: center;
            font-size: 0.65rem;
            color: #5a7a9a;
            letter-spacing: 0.4px;
            flex-shrink: 0;
        }

        .footer-credit strong {
            color: #8ab0d8;
            font-weight: 500;
        }

        .footer-credit .accent {
            color: #00e5ff;
            opacity: 0.6;
        }

        /* ---------- SCROLLBAR ---------- */
        ::-webkit-scrollbar {
            width: 3px;
            height: 3px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 16, 40, 0.3);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 229, 255, 0.15);
            border-radius: 20px;
        }

        /* ============================================================
                   RESPONSIVE — FULLY MOBILE OPTIMIZED
                   ============================================================ */

        /* --- Tablets & small laptops --- */
        @media (max-width: 768px) {
            .app-wrapper {
                padding: 1.4rem 1.2rem 1.2rem;
                border-radius: 2.2rem;
            }
            .brand {
                font-size: 1.9rem;
            }
            .tab-btn {
                font-size: 0.68rem;
                padding: 0.45rem 1rem;
            }
            .card {
                padding: 0.9rem 1rem;
                border-radius: 1.2rem;
            }
            .card-content {
                font-size: 0.78rem;
            }
            .card-content .label {
                min-width: 72px;
                font-size: 0.68rem;
            }
            .port-grid {
                grid-template-columns: repeat(auto-fill, minmax(52px, 1fr));
                gap: 0.35rem;
            }
            .port-item .port-num {
                font-size: 0.7rem;
            }
        }

        /* --- Large phones --- */
        @media (max-width: 600px) {
            body {
                padding: 0.4rem;
            }
            .app-wrapper {
                padding: 1rem 0.9rem 1rem;
                border-radius: 1.8rem;
            }
            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.2rem;
                margin-bottom: 1rem;
            }
            .brand {
                font-size: 1.7rem;
            }
            .toolbar {
                gap: 0.3rem;
                margin-bottom: 0.8rem;
            }
            .tab-btn {
                font-size: 0.6rem;
                padding: 0.35rem 0.8rem;
            }
            .input-group {
                flex-direction: column;
                gap: 0.4rem;
            }
            .input-group input {
                flex: 1 1 auto;
                width: 100%;
                font-size: 0.82rem;
                padding: 0.6rem 1rem;
                min-width: 0;
            }
            .action-buttons {
                flex-wrap: wrap;
                gap: 0.3rem;
            }
            .action-buttons .btn {
                flex: 1 1 auto;
                text-align: center;
                font-size: 0.65rem;
                padding: 0.45rem 0.8rem;
                min-width: 0;
            }
            .status {
                font-size: 0.65rem;
                min-height: 1.4rem;
                gap: 0.4rem;
            }
            .card {
                padding: 0.7rem 0.8rem;
                border-radius: 1rem;
            }
            .card-content {
                font-size: 0.72rem;
                gap: 0.15rem;
            }
            .card-content .label {
                min-width: 60px;
                font-size: 0.62rem;
            }
            .card-content .row {
                gap: 0.15rem 0.4rem;
            }
            .port-grid {
                grid-template-columns: repeat(auto-fill, minmax(46px, 1fr));
                gap: 0.25rem;
            }
            .port-item {
                padding: 0.25rem 0.1rem;
                border-radius: 14px;
            }
            .port-item .port-num {
                font-size: 0.6rem;
            }
            .port-item .port-service {
                font-size: 0.4rem;
            }
            .dns-records .record {
                font-size: 0.68rem;
            }
            .dns-records .record .rtype {
                font-size: 0.55rem;
                min-width: 38px;
            }
            .footer-credit {
                font-size: 0.55rem;
                margin-top: 1rem;
                padding-top: 0.6rem;
            }
        }

        /* --- Small phones (≤ 400px) --- */
        @media (max-width: 420px) {
            body {
                padding: 0.25rem;
            }
            .app-wrapper {
                padding: 0.7rem 0.6rem 0.9rem;
                border-radius: 1.4rem;
            }
            .brand {
                font-size: 1.4rem;
            }
            .tab-btn {
                font-size: 0.5rem;
                padding: 0.25rem 0.55rem;
                border-radius: 40px;
            }
            .input-group input {
                font-size: 0.72rem;
                padding: 0.5rem 0.8rem;
                border-radius: 40px;
            }
            .action-buttons .btn {
                font-size: 0.55rem;
                padding: 0.35rem 0.6rem;
                border-radius: 40px;
            }
            .status {
                font-size: 0.58rem;
                min-height: 1.2rem;
            }
            .status .badge {
                font-size: 0.45rem;
                padding: 0.02rem 0.5rem;
            }
            .card {
                padding: 0.5rem 0.6rem;
                border-radius: 0.8rem;
            }
            .card-title {
                font-size: 0.45rem;
                letter-spacing: 1px;
                margin-bottom: 0.3rem;
            }
            .card-content {
                font-size: 0.62rem;
                gap: 0.1rem;
            }
            .card-content .label {
                min-width: 48px;
                font-size: 0.52rem;
            }
            .card-content .row {
                gap: 0.1rem 0.3rem;
                padding: 0.03rem 0;
            }
            .card-content .tag {
                font-size: 0.5rem;
                padding: 0.01rem 0.4rem;
            }
            .port-grid {
                grid-template-columns: repeat(auto-fill, minmax(38px, 1fr));
                gap: 0.2rem;
            }
            .port-item {
                padding: 0.2rem 0.05rem;
                border-radius: 10px;
            }
            .port-item .port-num {
                font-size: 0.5rem;
            }
            .port-item .port-service {
                font-size: 0.35rem;
            }
            .port-item .port-status {
                font-size: 0.35rem;
            }
            .dns-records .record {
                font-size: 0.58rem;
                padding: 0.1rem 0;
            }
            .dns-records .record .rtype {
                font-size: 0.48rem;
                min-width: 32px;
            }
            .footer-credit {
                font-size: 0.48rem;
                margin-top: 0.8rem;
                padding-top: 0.4rem;
            }
        }

        /* --- Tiny screens (≤ 340px) --- */
        @media (max-width: 360px) {
            .app-wrapper {
                padding: 0.5rem 0.4rem 0.7rem;
                border-radius: 1rem;
            }
            .brand {
                font-size: 1.1rem;
            }
            .tab-btn {
                font-size: 0.45rem;
                padding: 0.2rem 0.4rem;
            }
            .input-group input {
                font-size: 0.62rem;
                padding: 0.4rem 0.6rem;
            }
            .action-buttons .btn {
                font-size: 0.48rem;
                padding: 0.3rem 0.5rem;
            }
            .card-content {
                font-size: 0.55rem;
            }
            .card-content .label {
                min-width: 40px;
                font-size: 0.48rem;
            }
            .port-grid {
                grid-template-columns: repeat(auto-fill, minmax(32px, 1fr));
                gap: 0.15rem;
            }
            .port-item .port-num {
                font-size: 0.42rem;
            }
            .footer-credit {
                font-size: 0.42rem;
            }
        }
    </style>
</head>
<body>

    <!-- Ambient glow orbs -->
    <div class="glow-orb glow-orb--1"></div>
    <div class="glow-orb glow-orb--2"></div>

    <div class="app-wrapper">

        <!-- HEADER (no version tag) -->
        <div class="header">
            <span class="brand">InFox</span>
            <!-- Credit moved to footer -->
        </div>

        <!-- TOOLBAR -->
        <div class="toolbar" id="toolbar">
            <button class="tab-btn active" data-tab="resolve">Resolve</button>
            <button class="tab-btn" data-tab="dns">DNS</button>
            <button class="tab-btn" data-tab="headers">Headers</button>
            <button class="tab-btn" data-tab="reverse">Reverse</button>
            <button class="tab-btn" data-tab="ports">Ports</button>
        </div>

        <!-- INPUT -->
        <div class="input-row">
            <div class="input-group">
                <input type="text" id="targetInput" placeholder="domain.com or 8.8.8.8" value="8.8.8.8" spellcheck="false" autofocus />
                <div class="action-buttons" id="actionButtons">
                    <button class="btn btn-primary" id="btnAction">Resolve</button>
                    <button class="btn" id="btnClear">Clear</button>
                </div>
            </div>
            <div class="status" id="statusMessage">
                <span class="badge">ready</span>
                <span id="statusText">Enter a target to begin</span>
            </div>
        </div>

        <!-- RESULTS -->
        <div class="results" id="resultsContainer">
            <!-- dynamically filled -->
        </div>

        <!-- FOOTER CREDIT -->
        <div class="footer-credit">
            <span class="accent"></span> <strong>Humayun Shariar Himu</strong> <span class="accent"></span>
        </div>

    </div>

    <script>
        (function() {
            'use strict';

            // ---------- DOM refs ----------
            const input = document.getElementById('targetInput');
            const btnAction = document.getElementById('btnAction');
            const btnClear = document.getElementById('btnClear');
            const statusEl = document.getElementById('statusMessage');
            const statusText = document.getElementById('statusText');
            const resultsEl = document.getElementById('resultsContainer');
            const toolbar = document.getElementById('toolbar');
            const tabBtns = toolbar.querySelectorAll('.tab-btn');

            // ---------- State ----------
            let currentTab = 'resolve';
            let isBusy = false;

            // ---------- Helpers ----------
            function setStatus(text, isBusyFlag = false, badge = null) {
                isBusy = isBusyFlag;
                let badgeHtml = '';
                if (badge) {
                    badgeHtml = `<span class="badge ${badge === 'error' ? 'error' : ''}">${escapeHtml(badge)}</span>`;
                } else {
                    badgeHtml = `<span class="badge">${isBusyFlag ? 'working' : 'ready'}</span>`;
                }
                statusEl.innerHTML = `${badgeHtml}<span id="statusText">${escapeHtml(text)}</span>`;
            }

            function escapeHtml(str) {
                if (!str) return '—';
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            function getTarget() {
                return input.value.trim() || '8.8.8.8';
            }

            function clearResults() {
                resultsEl.innerHTML = '';
            }

            function renderCard(title, contentHtml) {
                return `
                    <div class="card">
                        <div class="card-title"><span class="dot"></span> ${escapeHtml(title)}</div>
                        <div class="card-content">${contentHtml}</div>
                    </div>
                `;
            }

            function renderRow(label, value, highlight = false) {
                const valClass = highlight ? 'value highlight' : 'value';
                return `<div class="row"><span class="label">${escapeHtml(label)}</span><span class="${valClass}">${escapeHtml(value)}</span></div>`;
            }

            function renderTag(text, type = '') {
                return `<span class="tag ${type}">${escapeHtml(text)}</span>`;
            }

            // ---------- API: IP info using ip-api.com with proper headers ----------
            async function fetchIpInfo(ip) {
                const url =
                    `https://ip-api.com/json/${encodeURIComponent(ip)}?fields=status,message,country,regionName,city,isp,org,as,reverse,query,lat,lon,timezone`;
                const resp = await fetch(url, {
                    headers: {
                        'User-Agent': 'Mozilla/5.0 (InFox)',
                        'Accept': 'application/json'
                    }
                });
                if (!resp.ok) throw new Error(`HTTP ${resp.status} - ${resp.statusText}`);
                const data = await resp.json();
                if (data.status === 'fail') {
                    throw new Error(data.message || 'IP lookup failed');
                }
                return data;
            }

            // ---------- API: DNS (Google DNS over HTTPS) ----------
            async function fetchDns(domain, type = 'A') {
                const url =
                    `https://dns.google/resolve?name=${encodeURIComponent(domain)}&type=${type}`;
                const resp = await fetch(url);
                if (!resp.ok) throw new Error(`DNS lookup failed (${resp.status})`);
                const data = await resp.json();
                return data;
            }

            // ---------- TAB SWITCHING ----------
            function switchTab(tab) {
                currentTab = tab;
                tabBtns.forEach(b => b.classList.toggle('active', b.dataset.tab === tab));

                const btn = btnAction;
                const placeholders = {
                    resolve: 'domain.com or 8.8.8.8',
                    dns: 'domain.com',
                    headers: 'domain.com or IP',
                    reverse: 'IP address',
                    ports: 'domain.com or IP'
                };
                input.placeholder = placeholders[tab] || 'Enter target';

                const labels = {
                    resolve: 'Resolve',
                    dns: 'DNS',
                    headers: 'Headers',
                    reverse: 'Reverse',
                    ports: 'Ports'
                };
                btn.textContent = labels[tab] || 'Go';

                clearResults();
                setStatus(`Switch to ${tab} mode`);
            }

            tabBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    switchTab(btn.dataset.tab);
                });
                // touch feedback
                btn.addEventListener('touchstart', function() {
                    this.style.transform = 'scale(0.95)';
                }, { passive: true });
                btn.addEventListener('touchend', function() {
                    this.style.transform = '';
                }, { passive: true });
            });

            // ---------- MAIN ACTION ----------
            async function handleAction() {
                if (isBusy) return;
                const target = getTarget();
                if (!target) {
                    setStatus('Please enter a target', false, 'error');
                    return;
                }

                clearResults();
                setStatus(`Processing ${escapeHtml(target)} ...`, true);

                try {
                    switch (currentTab) {
                        case 'resolve':
                            await doResolve(target);
                            break;
                        case 'dns':
                            await doDnsLookup(target);
                            break;
                        case 'headers':
                            await doHeaders(target);
                            break;
                        case 'reverse':
                            await doReverse(target);
                            break;
                        case 'ports':
                            await doPortScan(target);
                            break;
                        default:
                            await doResolve(target);
                    }
                } catch (err) {
                    setStatus(`Error: ${err.message}`, false, 'error');
                    resultsEl.innerHTML = renderCard('Error', `<div class="value error-text">${escapeHtml(err.message)}</div>`);
                }
            }

            // ---------- RESOLVE ----------
            async function doResolve(target) {
                const isIp = /^(\d{1,3}\.){3}\d{1,3}$/.test(target);
                let ips = [];
                let info = null;

                if (isIp) {
                    ips = [target];
                    info = await fetchIpInfo(target);
                } else {
                    const data = await fetchDns(target, 'A');
                    if (!data.Answer || data.Answer.length === 0) {
                        throw new Error('No A records found');
                    }
                    ips = data.Answer.filter(r => r.type === 1).map(r => r.data);
                    if (ips.length === 0) throw new Error('No IPv4 addresses');
                    info = await fetchIpInfo(ips[0]);
                }

                let html = '';
                let infoHtml = renderRow('IP', info.query, true);
                if (info.reverse) infoHtml += renderRow('Hostname (PTR)', info.reverse);
                if (info.country) infoHtml += renderRow('Country', info.country);
                if (info.regionName) infoHtml += renderRow('Region', info.regionName);
                if (info.city) infoHtml += renderRow('City', info.city);
                if (info.isp) infoHtml += renderRow('ISP', info.isp);
                if (info.org) infoHtml += renderRow('Organization', info.org);
                if (info.as) infoHtml += renderRow('AS', info.as);
                if (info.lat && info.lon) infoHtml += renderRow('Coordinates', `${info.lat}, ${info.lon}`);
                if (info.timezone) infoHtml += renderRow('Timezone', info.timezone);
                html += renderCard('IP Intelligence', infoHtml);

                if (!isIp && ips.length > 0) {
                    let recHtml = ips.map(ip => renderTag(ip)).join(' ');
                    recHtml = `<div class="row"><span class="label">A Records</span><span class="value">${recHtml}</span></div>`;
                    try {
                        const aaaa = await fetchDns(target, 'AAAA');
                        if (aaaa.Answer && aaaa.Answer.length > 0) {
                            const aaaaIps = aaaa.Answer.filter(r => r.type === 28).map(r => r.data);
                            if (aaaaIps.length > 0) {
                                recHtml +=
                                `<div class="row"><span class="label">AAAA</span><span class="value">${aaaaIps.map(ip => renderTag(ip)).join(' ')}</span></div>`;
                            }
                        }
                    } catch (_) {}
                    html += renderCard('DNS Resolution', recHtml);
                }

                resultsEl.innerHTML = html;
                setStatus(`Resolved ${escapeHtml(target)} → ${escapeHtml(info.query)}`, false, 'done');
            }

            // ---------- DNS LOOKUP ----------
            async function doDnsLookup(domain) {
                const types = ['A', 'AAAA', 'MX', 'NS', 'TXT', 'CNAME'];
                let html = '';
                let found = false;

                for (const type of types) {
                    try {
                        const data = await fetchDns(domain, type);
                        if (data.Answer && data.Answer.length > 0) {
                            found = true;
                            const records = data.Answer.map(r => {
                                let val = r.data;
                                if (type === 'MX') {
                                    const parts = val.split(' ');
                                    val = `priority ${parts[0]} → ${parts.slice(1).join(' ')}`;
                                }
                                return `<div class="record"><span class="rtype">${type}</span><span class="rdata">${escapeHtml(val)}</span></div>`;
                            }).join('');
                            html += `<div class="dns-records">${records}</div>`;
                        }
                    } catch (_) { /* ignore */ }
                }

                if (!found) {
                    html = `<div class="value" style="color:#7a93b5;">No DNS records found for ${escapeHtml(domain)}</div>`;
                }

                resultsEl.innerHTML = renderCard('DNS Records', html);
                setStatus(`DNS lookup completed for ${escapeHtml(domain)}`, false, 'done');
            }

            // ---------- HTTP HEADERS ----------
            async function doHeaders(target) {
                const protocols = ['https', 'http'];
                let html = '';
                let found = false;

                for (const proto of protocols) {
                    const url = `${proto}://${target}`;
                    try {
                        const resp = await fetch(url, { method: 'HEAD', mode: 'cors' });
                        found = true;
                        let headersHtml = renderRow('Status', `${resp.status} ${resp.statusText}`);
                        const interesting = ['server', 'content-type', 'content-length', 'last-modified', 'etag',
                            'x-powered-by', 'x-frame-options', 'strict-transport-security'
                        ];
                        for (const key of interesting) {
                            const val = resp.headers.get(key);
                            if (val) {
                                headersHtml += renderRow(key, val);
                            }
                        }
                        const allHeaders = [];
                        resp.headers.forEach((v, k) => {
                            if (!interesting.includes(k.toLowerCase())) {
                                allHeaders.push(`${k}: ${v}`);
                            }
                        });
                        if (allHeaders.length > 0) {
                            headersHtml +=
                                `<div class="row"><span class="label">Other</span><span class="value" style="font-size:0.7rem;opacity:0.7;">${escapeHtml(allHeaders.join(' | '))}</span></div>`;
                        }
                        html += renderCard(`HTTP Headers (${proto.toUpperCase()})`, headersHtml);
                        break;
                    } catch (_) { /* ignore */ }
                }

                if (!found) {
                    html = `<div class="value" style="color:#7a93b5;">Could not fetch headers from ${escapeHtml(target)} (CORS or network issue)</div>`;
                    html = renderCard('HTTP Headers', html);
                }

                resultsEl.innerHTML = html;
                setStatus(`Header fetch completed for ${escapeHtml(target)}`, false, 'done');
            }

            // ---------- REVERSE IP ----------
            async function doReverse(target) {
                let ip = target;
                const isIp = /^(\d{1,3}\.){3}\d{1,3}$/.test(target);
                if (!isIp) {
                    const data = await fetchDns(target, 'A');
                    if (!data.Answer || data.Answer.length === 0) {
                        throw new Error('No A records found');
                    }
                    const ips = data.Answer.filter(r => r.type === 1).map(r => r.data);
                    if (ips.length === 0) throw new Error('No IPv4 addresses');
                    ip = ips[0];
                }

                const info = await fetchIpInfo(ip);
                let html = '';
                let infoHtml = renderRow('IP', info.query, true);
                if (info.reverse) infoHtml += renderRow('Hostname (PTR)', info.reverse);
                if (info.country) infoHtml += renderRow('Country', info.country);
                if (info.regionName) infoHtml += renderRow('Region', info.regionName);
                if (info.city) infoHtml += renderRow('City', info.city);
                if (info.isp) infoHtml += renderRow('ISP', info.isp);
                if (info.org) infoHtml += renderRow('Organization', info.org);
                if (info.as) infoHtml += renderRow('AS', info.as);
                html += renderCard('Reverse IP Lookup', infoHtml);

                const subnet = ip.split('.').slice(0, 3).join('.') + '.0/24';
                html += renderCard('Subnet Context', `
                    <div class="row"><span class="label">Subnet</span><span class="value">${escapeHtml(subnet)}</span></div>
                    <div style="font-size:0.6rem;color:#5a7a9a;margin-top:0.25rem;">Use external tools for full /24 enumeration</div>
                `);

                resultsEl.innerHTML = html;
                setStatus(`Reverse lookup completed for ${escapeHtml(ip)}`, false, 'done');
            }

            // ---------- PORT SCAN ----------
            async function doPortScan(target) {
                let ip = target;
                const isIp = /^(\d{1,3}\.){3}\d{1,3}$/.test(target);
                if (!isIp) {
                    const data = await fetchDns(target, 'A');
                    if (!data.Answer || data.Answer.length === 0) {
                        throw new Error('No A records found');
                    }
                    const ips = data.Answer.filter(r => r.type === 1).map(r => r.data);
                    if (ips.length === 0) throw new Error('No IPv4 addresses');
                    ip = ips[0];
                }

                setStatus(`Scanning ${escapeHtml(ip)} (HTTP/HTTPS ports) ...`, true);

                const scanPorts = [
                    { port: 80, service: 'HTTP' },
                    { port: 443, service: 'HTTPS' },
                    { port: 8080, service: 'HTTP-Alt' },
                    { port: 8443, service: 'HTTPS-Alt' },
                    { port: 8000, service: 'HTTP-Alt' },
                    { port: 8888, service: 'HTTP-Alt' },
                    { port: 3000, service: 'Node.js' },
                    { port: 5000, service: 'Python' },
                    { port: 9000, service: 'App' },
                ];

                const results = [];
                for (const p of scanPorts) {
                    const proto = (p.port === 443 || p.port === 8443) ? 'https' : 'http';
                    const url = `${proto}://${ip}:${p.port}`;
                    try {
                        const controller = new AbortController();
                        const timeoutId = setTimeout(() => controller.abort(), 3000);
                        const resp = await fetch(url, {
                            method: 'HEAD',
                            mode: 'cors',
                            signal: controller.signal,
                        });
                        clearTimeout(timeoutId);
                        results.push({
                            ...p,
                            status: 'open',
                            detail: `${resp.status} ${resp.statusText}`
                        });
                    } catch (err) {
                        if (err.name === 'AbortError') {
                            results.push({ ...p, status: 'closed', detail: 'timeout' });
                        } else {
                            results.push({ ...p, status: 'unknown', detail: err.message });
                        }
                    }
                    await new Promise(r => setTimeout(r, 100));
                }

                let portHtml = '<div class="port-grid">';
                for (const r of results) {
                    const cls = r.status === 'open' ? 'open' : (r.status === 'unknown' ? 'unknown' : 'closed');
                    const statusLabel = r.status === 'open' ? '●' : (r.status === 'unknown' ? '?' : '○');
                    portHtml += `
                        <div class="port-item ${cls}">
                            <span class="port-num">${r.port}</span>
                            <span class="port-service">${r.service}</span>
                            <span class="port-status">${statusLabel}</span>
                        </div>
                    `;
                }
                portHtml += '</div>';

                const openCount = results.filter(r => r.status === 'open').length;
                const summary = `Found ${openCount} open port${openCount !== 1 ? 's' : ''} out of ${results.length} scanned`;

                let html = `
                    <div style="margin-bottom:0.5rem;font-size:0.75rem;color:#7a93b5;">
                        Target: <span class="highlight" style="color:#00e5ff;">${escapeHtml(ip)}</span>
                        <span style="margin-left:0.5rem;">● open  ○ closed  ? unknown</span>
                    </div>
                    ${portHtml}
                    <div style="margin-top:0.5rem;font-size:0.65rem;color:#5a7a9a;">
                        ${summary}
                        <br><span style="font-size:0.55rem;">Note: Only HTTP/HTTPS ports can be tested in browser. Non-HTTP ports require server-side tools.</span>
                    </div>
                `;

                resultsEl.innerHTML = renderCard('Port Scan Results', html);
                setStatus(`Scan complete: ${summary}`, false, 'done');
            }

            // ---------- CLEAR ----------
            btnClear.addEventListener('click', () => {
                input.value = '';
                clearResults();
                setStatus('Cleared');
            });

            // ---------- ACTION ----------
            btnAction.addEventListener('click', handleAction);
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    handleAction();
                }
            });

            // ---------- INIT ----------
            window.addEventListener('load', () => {
                switchTab('resolve');
                setTimeout(() => {
                    handleAction();
                }, 400);
            });

        })();
    </script>

</body>
</html>
